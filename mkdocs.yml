site_name: IFT2015 - Structures de données
site_description: Site des démonstrations du cours IFT2015 - Structures de données
site_author: Zakary Gaillard-Duchassin
site_url: https://zgaillard.github.io/ift2015-demos-web/

repo_name: ift2015-demos-web
repo_url: https://github.com/ZGaillard/ift2015-demos-web

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

nav:
  - Accueil: index.md
  - Programme: cursus.md
  - Exercices:
      - Aperçu: exercices/index.md
      - "Démonstration 2 : Listes et listes positionnelles": exercices/demo2.md
      - "Démonstration 3 : Piles, Files, Deques et Liste de Favoris": exercices/demo3.md
      - "Démonstration 4 : Files avec priorités et Tas (Heaps)": exercices/demo4.md
      - "Démonstration 5 : Révision Mi-Session": exercices/demo5.md
      - "Démonstration 6 : Maps et Tables de Hachage": exercices/demo6.md
      - "Démonstration 7 : BST, Maps ordonnées et Graphes II": exercices/demo7.md
      - "Démonstration 8 : Map ordonnée et Arbres de recherche": exercices/demo8.md
      - "Démonstration 9 : Arbres AVL et Splay": exercices/demo9.md
      - "Démonstration 10 : Arbres Rouge-Noir": exercices/demo10.md
      - "Défis : Série de problèmes ludiques": exercices/challenges.md
      - "Examen Final Pratique": exercices/final-exam.md
  - "TP1 : Autocomplétion": tp/index.md
  - "Aide-mémoire — Intra": cheatsheet-intra.md
  - Corrections: corrections.md
  - Configuration: configuration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - fr
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
          site_name: "IFT2015 - Structures de données"
        - locale: en
          name: English
          build: true
          site_name: "IFT2015 - Data Structures"
          nav_translations:
            Accueil: Home
            Programme: Curriculum
            Exercices: Exercises
            Aperçu: Overview
            "Démonstration 2 : Listes et listes positionnelles": "Demo 2: Lists and Positional Lists"
            "Démonstration 3 : Piles, Files, Deques et Liste de Favoris": "Demo 3: Stacks, Queues, Deques and Favorites List"
            "Démonstration 4 : Files avec priorités et Tas (Heaps)": "Demo 4: Priority Queues and Heaps"
            "Démonstration 5 : Révision Mi-Session": "Demo 5: Mid-Session Review"
            "Démonstration 6 : Maps et Tables de Hachage": "Demo 6: Maps and Hash Tables"
            "Démonstration 7 : BST, Maps ordonnées et Graphes II": "Demo 7: BST, Sorted Maps and Graphs II"
            "Démonstration 8 : Map ordonnée et Arbres de recherche": "Demo 8: Sorted Map and Search Trees"
            "Démonstration 9 : Arbres AVL et Splay": "Demo 9: AVL and Splay Trees"
            "Démonstration 10 : Arbres Rouge-Noir": "Demo 10: Red-Black Trees"
            "Défis : Série de problèmes ludiques": "Challenges: Fun Problem Set"
            "TP1 : Autocomplétion": "Lab 1: Autocomplete"
            "Aide-mémoire — Intra": "Cheatsheet — Midterm"
            Corrections: Answer Keys
            Configuration: Configuration
        - locale: zh
          name: 简体中文
          build: true
          site_name: "IFT2015 - 数据结构"
          nav_translations:
            Accueil: 首页
            Programme: 课程大纲
            Exercices: 练习
            Aperçu: 概览
            "Démonstration 2 : Listes et listes positionnelles": "演示 2：列表与位置列表"
            "Démonstration 3 : Piles, Files, Deques et Liste de Favoris": "演示 3：栈、队列、双端队列与收藏列表"
            "Démonstration 4 : Files avec priorités et Tas (Heaps)": "演示 4：优先队列与堆"
            "Démonstration 5 : Révision Mi-Session": "演示 5：期中复习"
            "Démonstration 6 : Maps et Tables de Hachage": "演示 6：映射与哈希表"
            "Démonstration 7 : BST, Maps ordonnées et Graphes II": "演示 7：BST、有序映射与图 II"
            "Démonstration 8 : Map ordonnée et Arbres de recherche": "演示 8：有序映射与搜索树"
            "Démonstration 9 : Arbres AVL et Splay": "演示 9：AVL 树与 Splay 树"
            "Démonstration 10 : Arbres Rouge-Noir": "演示 10：红黑树"
            "Défis : Série de problèmes ludiques": "挑战题：趣味题集"
            "TP1 : Autocomplétion": "实验1：自动补全"
            "Aide-mémoire — Intra": "速查表 — 期中"
            Corrections: 答案
            Configuration: 配置
  - mkdocs_matplotlib

extra_javascript:
  - javascripts/toc-toggle.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zakary
    - icon: fontawesome/solid/envelope
      link: mailto:zakary.gaillard-duchassin@umontreal.ca

copyright: |
  &copy; 2026 Zakary Gaillard-Duchassin - Université de Montréal
